spring.application.name=family-home

spring.datasource.url=jdbc:postgresql://localhost:5432/family_tasks
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.admin.username=${APP_ADMIN_USERNAME:admin}
app.time-zone=Asia/Jerusalem

# Flyway baseline & PostgreSQL-specific migrations for existing databases
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration,classpath:db/postgresql

# Allow idle DB connections to close so serverless PostgreSQL (e.g. Neon) can scale to zero
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=60000

# Expose only health and info Actuator endpoints
management.endpoints.web.exposure.include=health,info


