spring.application.name=family-home

spring.datasource.url=jdbc:postgresql://localhost:5432/family_tasks
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.admin.username=${APP_ADMIN_USERNAME:admin}

# Flyway baseline & PostgreSQL-specific migrations for existing databases
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration,classpath:db/migration/postgresql


