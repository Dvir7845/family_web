services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: family_tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-familyhome_dev}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d family_tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/family_tasks
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-familyhome_dev}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:-AdminPass123!}
    ports:
      - "8080:10000"

volumes:
  pg_data:
